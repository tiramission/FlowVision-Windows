<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FlowVision</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">FlowVision</span>
      </div>
      <button class="icon-btn" id="btn-pick-folder" title="打开文件夹 (Ctrl+O)">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v6M9 14h6" class="stroke"/></svg>
      </button>
    </div>

    <div class="side-scroll">
      <section class="side-section" id="sec-fav">
        <header><span>收藏</span></header>
        <div class="side-list" id="fav-list"></div>
      </section>

      <section class="side-section">
        <header><span>位置</span></header>
        <div class="side-list" id="place-list"></div>
      </section>

      <section class="side-section" id="sec-tree">
        <header><span>文件夹</span></header>
        <div class="tree" id="tree-root"></div>
      </section>
    </div>

    <div class="side-foot">
      <button id="btn-settings" class="ghost-btn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>设置</span>
      </button>
      <div class="side-hint">Waterfall · Windows</div>
    </div>
  </aside>

  <div id="resizer"></div>

  <main id="main">
    <div id="tabbar">
      <div id="tabs"></div>
      <button class="icon-btn" id="btn-newtab" title="新建标签页 (Ctrl+T)">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" class="stroke"/></svg>
      </button>
      <div class="tabbar-fill"></div>
      <button class="icon-btn" id="btn-view-fullscreen" title="切换视图 (F11)">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M20 9V4h-5M4 15v5h5" class="stroke"/></svg>
      </button>
    </div>

    <div id="toolbar">
      <div class="nav-group">
        <button class="icon-btn" id="btn-back" title="返回 (S / Ctrl+[)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" class="stroke"/></svg></button>
        <button class="icon-btn" id="btn-prev-folder" title="上一文件夹 (A)"><svg viewBox="0 0 24 24"><path d="M14 6l-5 6 5 6" class="stroke"/><path d="M19 6l-5 6 5 6" class="stroke"/></svg></button>
        <button class="icon-btn" id="btn-next-folder" title="下一文件夹 (D)"><svg viewBox="0 0 24 24"><path d="M10 6l5 6-5 6" class="stroke"/><path d="M5 6l5 6-5 6" class="stroke"/></svg></button>
        <button class="icon-btn" id="btn-up" title="上一级 (W)"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" class="stroke"/></svg></button>
        <button class="icon-btn" id="btn-refresh" title="刷新 (F5)"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7" class="stroke"/><path d="M20 4v7h-7" class="stroke"/></svg></button>
      </div>

      <div class="crumb" id="crumb"></div>

      <div class="tool-fill"></div>

      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4" class="stroke"/></svg>
        <input id="search" placeholder="筛选此文件夹 (Ctrl+F)" spellcheck="false" />
      </label>

      <select id="sort" title="排序">
        <option value="name">名称</option>
        <option value="date">日期</option>
        <option value="size">大小</option>
        <option value="type">类型</option>
      </select>
      <button class="icon-btn" id="btn-sort-dir" title="升序 / 降序"><svg viewBox="0 0 24 24"><path d="M7 20V4M4 7l3-3 3 3M14 8h6M14 12h5M14 16h3" class="stroke"/></svg></button>

      <button class="icon-btn" id="btn-thumb-smaller" title="缩小缩略图 (Ctrl+-)"><svg viewBox="0 0 24 24"><path d="M5 12h14" class="stroke"/></svg></button>
      <button class="icon-btn" id="btn-thumb-larger" title="放大缩略图 (Ctrl+=)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" class="stroke"/></svg></button>
    </div>

    <div id="content">
      <div id="grid"></div>
      <div class="empty" id="empty" hidden>
        <div class="empty-icon"></div>
        <div class="empty-title"></div>
        <div class="empty-sub"></div>
      </div>
      <div class="drop-hint" id="drop-hint">松开以打开此文件夹</div>
    </div>

    <div id="statusbar">
      <span id="status-left">就绪</span>
      <span class="status-fill"></span>
      <span id="status-right"></span>
    </div>
  </main>
</div>

<div id="viewer" hidden>
  <div class="v-top">
    <div class="v-title" id="v-title"></div>
    <div class="v-actions">
      <button class="v-btn" id="v-info-btn" title="信息 (I)">信息</button>
      <button class="v-btn" id="v-rotate" title="旋转 (R)">旋转</button>
      <button class="v-btn" id="v-fit" title="适应窗口 (F)">适应</button>
      <button class="v-btn" id="v-100" title="100% (1)">100%</button>
      <button class="v-btn" id="v-sep" hidden></button>
      <button class="v-btn" id="v-open-ext" title="用系统应用打开">外部打开</button>
      <button class="v-btn v-close" id="v-close" title="关闭 (Esc)">✕</button>
    </div>
  </div>
  <div class="v-stage" id="v-stage">
    <img id="v-image" hidden draggable="false" />
    <video id="v-video" hidden controls playsinline></video>
    <div class="v-unsupported" id="v-unsupported" hidden>
      <div class="v-unsupported-title">此格式无法在这里显示</div>
      <div class="v-unsupported-sub"></div>
      <button class="v-btn" id="v-unsupported-open">用系统应用打开</button>
    </div>
    <div class="v-nav v-prev" id="v-prev" title="上一张 (←)"></div>
    <div class="v-nav v-next" id="v-next" title="下一张 (→)"></div>
    <div class="v-zoom" id="v-zoom"></div>
  </div>
  <aside class="v-side" id="v-side">
    <div class="v-side-head">
      <span>信息</span>
      <button class="v-btn" id="v-side-close">✕</button>
    </div>
    <div class="v-side-body" id="v-side-body"></div>
  </aside>
</div>

<div id="menu" hidden></div>
<div id="dialog-back" hidden><div id="dialog"></div></div>
<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
